apiVersion: v1
kind: Service
metadata:
  name: {{ include "emp-dir-helm.fullname" . }}
  labels:
    {{- include "emp-dir-helm.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "emp-dir-helm.selectorLabels" . | nindent 4 }}
  type: {{ .Values.service.type }}
  ports:
    - name: emp-port
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}