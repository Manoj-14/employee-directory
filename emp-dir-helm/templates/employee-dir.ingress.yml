apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "emp-dir-helm.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "emp-dir-helm.fullname" . }}
    {{- include "emp-dir-helm.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"

    # CORS Configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Accept, Origin, User-Agent, Cache-Control, Keep-Alive"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"

    # nginx.ingress.kubernetes.io/configuration-snippet: |
    #   add_header Origin-Agent-Cluster "?0" always;
spec:
  ingressClassName: nginx
  rules:
  - host: employee.manojm.site
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ include "emp-dir-helm.fullname" . }}
            port: 
              number: 8000