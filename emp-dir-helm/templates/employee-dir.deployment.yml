apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "emp-dir-helm.fullname" . }}
  labels:
    {{- include "emp-dir-helm.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      {{- include "emp-dir-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "emp-dir-helm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - image: "{{.Values.image.repository}}:{{.Values.image.tag}}"
          name: employee-dir
          pullPolicy: {{.Values.image.pullPolicy}}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "emp-dir-helm.fullname" . }}
          resources:
            limits:
              cpu: 300m
              memory: 300Mi
            requests:
              cpu: 200m
              memory: 200Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
